.main{margin-left:240px;flex:1}.topbar{height:64px;background:#fff;border-bottom:3px solid #B9DDE4;display:flex;align-items:center;justify-content:space-between;padding:0 26px;position:sticky;top:0;z-index:5}
.topbar .title{font-weight:700}.top-actions{display:flex;gap:10px;align-items:center}.iconbtn,.btn{border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:7px}.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary)}.btn.danger{background:var(--critical);color:#fff;border-color:var(--critical)}.btn.success{background:var(--success);color:#fff;border-color:var(--success)}

.mobile{max-width:390px;margin:auto;background:#fff;border:8px solid #243746;border-radius:24px;min-height:600px;overflow:hidden}.mobile .mhead{background:linear-gradient(180deg,var(--primary-dark),var(--primary));color:#fff;padding:15px}.mobile .mcontent{padding:14px}.mnav{display:flex;justify-content:space-around;border-top:1px solid var(--line);padding:10px;font-size:11px}

.skip-link{position:absolute;left:-9999px;top:8px;background:#fff;color:#24304A;padding:8px 12px;border-radius:6px;z-index:100}

.step.active{color:var(--primary);font-weight:700}.step.active .n{background:var(--primary);color:#fff}
.step-line{height:1px;flex:1;background:var(--line)}
.command{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 11px;width:min(430px,45vw)}
.command input{border:0;outline:0;width:100%;font-size:12px}

</style>
</head>

function risk(r){return `<span class="risk ${r.toLowerCase()}">${r}</span>`}
function layout(title,sub,body,actions=""){document.getElementById("topTitle").textContent=title;document.getElementById("content").innerHTML=`<div class="page-head"><div><h1>${title}</h1><p>${sub}</p></div><div>${actions}</div></div>${body}`}

function go(page){navActive(page);pages[page]()}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2200)}
function openModal(type,data={}){const m=document.getElementById("modal");let h="";
if(type==="case")h=`<div class="modal-head"><h2>Create Case</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><label>Beneficiary<input value="${data.name||''}" placeholder="Search beneficiary"></label><label>Risk<select><option>Critical</option><option>High</option><option>Medium</option><option>Low</option></select></label><label>Trigger<textarea placeholder="Describe detected signal"></textarea></label><div style="text-align:right"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="closeModal();toast('Case created and routed')">Create & Route</button></div>`;
if(type==="profile")h=`<div class="modal-head"><h2>User Profile</h2><button class="iconbtn" onclick="closeModal()">✕</button></div><div class="kv" style="margin-top:18px"><b>User</b><span>District Operator</span><b>District</b><span>Shahdol</span><b>Role</b><span>Operator / Stakeholder</span><b>Access</b><span>Case, beneficiary, referral, reporting</span></div>`;

dashboard(){
layout("District Operations Dashboard","Maternal & Newborn Safety Initiative · Shahdol",`<div class="health-banner"><span class="heart">♥</span><span><b>Good morning, Operator.</b> Start with the most urgent actions. Confirm patient-facing actions before escalation.</span></div><div class="task-strip"><span class="task-chip"><b>6</b> critical cases</span><span class="task-chip"><b>11</b> overdue</span><span class="task-chip"><b>8</b> referrals awaiting outcome</span><span class="task-chip"><b>132</b> calls pending</span></div>
<div class="grid kpis">
${[['Total Beneficiaries','1,248','+4.2%'],['Critical','18','Needs action'],['High','76','12 new today'],['Open Cases','143','31 due today'],['Overdue','11','Escalate now'],['Referrals','27','8 awaiting outcome']].map(x=>`<div class="card kpi"><div class="label">♥ ${x[0]}</div><div class="value">${x[1]}</div><div class="trend">${x[2]}</div></div>`).join('')}
</div>
<div class="grid two" style="margin-top:16px">
<div class="card"><h3 class="section-title">Critical / High Risk Queue</h3>
${cases.slice(0,3).map(c=>`<div class="alert"><div style="flex:1"><b>${c.benef} · ${c.id}</b><span>${risk(c.risk)} &nbsp; ${c.trigger}</span><div class="muted" style="margin-top:5px">Owner: ${c.owner} · SLA: ${c.sla}</div></div><button class="btn danger" onclick="go('cases')">Open</button></div>`).join('')}
</div>
<div class="card"><h3 class="section-title">Today's Performance</h3>
<div class="muted">Outbound contactability</div><div class="bar" style="margin:7px 0 13px"><i style="width:90%"></i></div><b>90%</b>
<div class="muted" style="margin-top:15px">Case acknowledgement</div><div class="bar" style="margin:7px 0 13px"><i style="width:84%"></i></div><b>84%</b>

</div></div>
<div class="grid three" style="margin-top:16px">
<div class="card"><h3 class="section-title">Risk Trend</h3><div style="font-size:12px">Mon ▂ Tue ▃ Wed ▅ Thu ▄ Fri ▆ Sat ▇ Sun ▆</div></div>

<div class="card"><h3 class="section-title">Quick Actions</h3><button class="btn primary" onclick="openModal('case')">+ Create Case</button> <button class="btn" onclick="go('beneficiaries')">Search</button></div>
</div>`,"<button class='btn primary' onclick=\"go('beneficiaries')\">Search Beneficiary</button>");

function quickSearch(){

  const q=(document.getElementById('globalSearch')?.value||'').trim();

  if(!q){
    toast('Type a beneficiary, case or referral');
    return
  }

  go('beneficiaries');

  setTimeout(()=>{
    const el=document.getElementById('bsearch');

    if(el){
      el.value=q;
      filterBeneficiaries()
    }
  },30);
}


/* =========================================================
   BENEFICIARY FILTER
========================================================= */

function filterBeneficiaries(){

  const q=(document.getElementById('bsearch')?.value||'').toLowerCase();

  const rf=document.getElementById('riskfilter')?.value||'';

  const rows=beneficiaries.filter(
    b=>
      (!q||JSON.stringify(b).toLowerCase().includes(q)) &&
      (!rf||b.risk===rf)
  );

  const el=document.getElementById('benefRows');

  if(!el)return;

  el.innerHTML=rows.map(b=>
  `<tr class='clickable'>
    <td>${b.id}</td>

    <td>
      <b>${b.name}</b>
      <div class='muted'>${b.age} yrs · ${b.location}</div>
    </td>

    <td>${b.stage}</td>

    <td>${risk(b.risk)}</td>

    <td>${b.phc}</td>

    <td>${b.last}</td>

    <td>${b.case}</td>

    <td>
      <button
        class='btn'
        onclick='openModal("beneficiary",${JSON.stringify(b).replace(/"/g,"&quot;")})'
      >
        View
      </button>
    </td>
  </tr>`
  ).join('');
}

          <b>Case ID</b><span>${c.id}</span>
          <b>Beneficiary</b><span>${c.benef}</span>
          <b>Owner</b><span>${c.owner}</span>
          <b>Status</b><span>${c.status}</span>
          <b>SLA</b><span><b>${c.sla}</b></span>
        </div>

        <br>

        <button class='btn primary' onclick="toast('Case acknowledged')">
          Acknowledge
        </button>

        <button class='btn danger' onclick="toast('Case escalated')">
          Escalate
        </button>

        <button class='btn success' onclick="toast('Case resolved')">
          Resolve
        </button>

      </div>

      <div class='card'>

        <h3 class='section-title'>Case Timeline</h3>

        <div class='timeline'>

          <div class='event'>
            <b>10:42 · Created</b>
            <p>Signal detected by AI voice interaction</p>
          </div>

          <div class='event'>
            <b>10:43 · Routed</b>
            <p>Assigned to ${c.owner}</p>
          </div>

          <div class='event'>
            <b>10:44 · Awaiting action</b>
            <p>SLA countdown active</p>
          </div>

        </div>

      </div>

    </div>

    <div class='card' style='margin-top:16px'>

      <h3 class='section-title'>
        Add Case Note / Action
      </h3>

      <textarea
        style='width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:10px'
        placeholder='Enter action, remarks or supporting information'
      ></textarea>

      <br><br>

      <button
        class='btn primary'
        onclick="toast('Case note added to audit trail')"
      >
        Add Note
      </button>

    </div>`
  );
}


/* =========================================================
   NAVIGATION
========================================================= */

document.querySelectorAll('.nav button').forEach(
  b=>b.addEventListener('click',()=>go(b.dataset.page))
);


/* =========================================================
   MODAL CLOSE
========================================================= */

document.getElementById('modalBg').addEventListener(
  'click',
  e=>{
    if(e.target.id==='modalBg')closeModal()
  }
);


/* =========================================================
   RESPONSIVE SIDEBAR INITIAL STATE
========================================================= */

function initializeSidebar(){

  const isMobile=window.innerWidth<=720;

  const menuBtn=document.getElementById("menuBtn");

  if(isMobile){

    document.body.classList.add("sidebar-hidden");

    if(menuBtn){
      menuBtn.classList.add("active");
      menuBtn.setAttribute("aria-expanded","false");
    }

  }else{

    document.body.classList.remove("sidebar-hidden");

    if(menuBtn){
      menuBtn.classList.remove("active");
      menuBtn.setAttribute("aria-expanded","true");
    }

  }

}


/* =========================================================
   WINDOW RESIZE
========================================================= */

window.addEventListener("resize",()=>{

  const isMobile=window.innerWidth<=720;

  if(isMobile){

    if(!document.body.classList.contains("sidebar-hidden")){

      document.body.classList.add("sidebar-hidden");

    }

    document.getElementById("menuBtn")?.classList.add("active");

  }

});


/* =========================================================
   START
========================================================= */

initializeSidebar();

go('dashboard');

</script>

</body>
</html>
